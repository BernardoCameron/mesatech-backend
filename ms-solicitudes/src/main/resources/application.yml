server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-solicitudes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesatech}
    username: ${DB_USER:mesatech}
    password: ${DB_PASSWORD:mesatech}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    cl.mesatech: INFO
