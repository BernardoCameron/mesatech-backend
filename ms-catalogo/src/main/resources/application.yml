server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-catalogo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesatech}
    username: ${DB_USER:mesatech}
    password: ${DB_PASSWORD:mesatech}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    cl.mesatech: INFO
