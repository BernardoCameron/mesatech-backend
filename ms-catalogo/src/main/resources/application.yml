server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-catalogo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesatech}
    username: ${DB_USER:mesatech}
    password: ${DB_PASSWORD:mesatech}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:catalogo_publicador}
    password: ${RABBIT_PASSWORD:}
    virtual-host: ${RABBIT_VHOST:mesatech}
    connection-timeout: 5s
    # Confirmaciones del broker y aviso si el mensaje no llega a ninguna cola
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

app:
  rabbitmq:
    exchange: catalogo.exchange
    routing-key: categoria.creada

logging:
  level:
    cl.mesatech: INFO
