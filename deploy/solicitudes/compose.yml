# EC2 ep2-solicitudes: ms-solicitudes (consumidor) conectado a su RDS y a RabbitMQ.
# Uso (dentro de deploy/solicitudes):  cp .env.example .env  y  docker compose up -d --build
services:
  ms-solicitudes:
    build: ../../ms-solicitudes
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: ${RABBIT_HOST}
      RABBIT_USER: solicitudes_consumidor
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    ports:
      - "8081:8081"
