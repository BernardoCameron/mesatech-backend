server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bff
  security:
    oauth2:
      resourceserver:
        jwt:
          # Id. de directorio (inquilino) de Microsoft Entra ID.
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}/v2.0
          # Client ID de la App Registration "mesatech-api" (Expose an API).
          audiences: ${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

mesatech:
  ms-solicitudes:
    base-url: ${MS_SOLICITUDES_URL:http://localhost:8081}
  ms-catalogo:
    base-url: ${MS_CATALOGO_URL:http://localhost:8082}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    cl.mesatech: INFO
    org.springframework.security: INFO
